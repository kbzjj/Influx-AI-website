<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="网站视觉与动效学习模板中心。浏览已复刻的网站，点击封面打开本地预览。">
  <title>Replica — 网站模板中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231e362c'/%3E%3Cpath d='M10 12h13v13H10zM17 19h13v13H17z' fill='none' stroke='%23d7ff9c' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/center.css">
  <script src="/center.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Replica 模板中心首页"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="11" y="11" width="18" height="18" rx="3"/></svg><span>replica<span class="brand-dot">.</span></span></a>
      <div class="sidebar-label">YOUR COLLECTION</div>
      <button class="collection-link selected" type="button" id="all-templates"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg><span>全部模板</span><span id="sidebar-count" class="count">—</span></button>
      <div class="sidebar-note"><span class="status-dot"></span> LOCAL LIBRARY<p>好的设计，值得反复打开。</p></div>
    </aside>

    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong>网站模板中心</strong></div><span class="local-badge"><i></i>本地预览</span></header>
      <main>
        <section class="intro">
          <div class="eyebrow"><span></span> A COLLECTION TO LEARN FROM</div>
          <h1>你的灵感，<span>已存档。</span></h1>
          <p>从视觉到动效，把喜欢的网站留在身边。<br class="mobile-break">点击封面，开始探索。</p>
          <div class="collection-stat"><span id="total-count">—</span><div>个网站模板<br><small>持续收集中</small></div><svg viewBox="0 0 52 52" aria-hidden="true"><path d="M9 37 37 9M10 9h27v27"/></svg></div>
        </section>

        <section class="library" aria-label="网站模板列表">
          <div class="toolbar">
            <div class="filters" id="filters" aria-label="模板分类"></div>
            <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg><input id="search" type="search" placeholder="搜索模板、风格或动效…" aria-label="搜索模板"><span>⌘ K</span></label>
          </div>
          <div class="results-line"><span id="result-count" role="status" aria-live="polite">正在读取模板…</span><span>按封面探索 <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v11M4 9l4 4 4-4"/></svg></span></div>
          <div class="template-grid" id="template-grid"></div>
          <div class="empty-state" id="empty-state" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="12"/><path d="m29 29 10 10"/></svg><h2>还没找到这个灵感</h2><p>试试模板名称、技术栈或动效关键词。</p><button id="clear-search" type="button">查看全部模板</button></div>
          <div class="error-state" id="error-state" hidden><h2>暂时无法读取模板</h2><p id="error-message"></p><button id="retry" type="button">重新加载</button></div>
        </section>
        <footer><span>REPLICA LIBRARY <b>·</b> 视觉与动效的学习收藏</span><span>看见好设计，也看懂它。</span></footer>
      </main>
    </div>
  </div>
</body>
</html>
